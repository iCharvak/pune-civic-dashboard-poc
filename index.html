<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ward click-through — working prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A4A; --ink-2:#26385E; --paper:#EFEBE0; --paper-2:#E4DFCF; --paper-3:#F6F3EA;
    --seal:#A63D2F; --gold:#9C6F1E; --sage:#3F5E42; --grey:#6B6A5E; --line:#C9C2AC;
  }
  *{box-sizing:border-box;}
  body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;margin:0;padding:32px;}
  h1,h2,h3{font-family:'Zilla Slab',serif;margin:0;font-weight:600;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .wrap{max-width:1000px;margin:0 auto;}
  .note{background:var(--paper-3);border-left:3px solid var(--gold);padding:14px 18px;font-size:13px;color:var(--grey);line-height:1.6;margin-bottom:28px;}
  h1{font-size:24px;margin-bottom:6px;}
  .subtitle{font-size:14px;color:var(--grey);margin-bottom:28px;}

  .ward-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px;}
  .ward-card{
    background:var(--paper-3);border:1px solid var(--line);padding:18px;position:relative;
    cursor:pointer;transition:border-color .15s ease;
  }
  .ward-card.disabled{cursor:default;opacity:0.5;}
  .ward-card:not(.disabled):hover{border-color:var(--ink);}
  .ward-card.active{border-color:var(--seal);border-width:2px;}
  .ward-num{font-family:'Zilla Slab',serif;font-size:24px;font-weight:600;}
  .ward-name{font-size:12px;color:var(--grey);margin-top:2px;min-height:30px;}
  .ward-stamp{
    position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;
    border:1.5px solid var(--seal);color:var(--seal);display:flex;align-items:center;justify-content:center;
    flex-direction:column;transform:rotate(-8deg);font-family:'IBM Plex Mono',monospace;
  }
  .ward-card.disabled .ward-stamp{border-color:var(--grey);color:var(--grey);}
  .ward-stamp .cnt{font-size:14px;font-weight:500;line-height:1;}
  .ward-stamp .lbl{font-size:6px;letter-spacing:0.5px;text-transform:uppercase;line-height:1;margin-top:1px;}
  .tap-hint{font-size:10px;color:var(--seal);margin-top:10px;font-family:'IBM Plex Mono',monospace;}
  .ward-card.disabled .tap-hint{color:var(--grey);}

  #detail{display:none;background:var(--ink);color:var(--paper);padding:28px 32px;margin-top:4px;}
  #detail.show{display:block;}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #3A4C74;padding-bottom:16px;margin-bottom:20px;}
  .detail-head h2{color:var(--paper);font-size:22px;}
  .detail-head .meta{font-size:12px;color:#9AA6C0;margin-top:4px;}
  .close-btn{background:none;border:1px solid #3A4C74;color:var(--paper);padding:6px 12px;font-size:12px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;}
  .close-btn:hover{border-color:var(--paper);}

  .item-card{background:#243758;padding:16px 18px;margin-bottom:12px;}
  .item-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .item-subj{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#E4B36B;}
  .item-date{font-size:11px;color:#9AA6C0;}
  .item-desc{font-size:14px;line-height:1.6;color:#E2E6EE;margin-bottom:10px;}
  .item-foot{display:flex;flex-wrap:wrap;gap:16px;font-size:11px;color:#9AA6C0;border-top:1px solid #3A4C74;padding-top:10px;}
  .item-foot .mono{color:#C7CEDF;}
  .item-foot b{color:#E2E6EE;font-weight:500;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Ward click-through — working prototype</h1>
  <div class="subtitle">This is wired to real extracted data, not placeholders. Click a highlighted ward.</div>

  <div class="note" id="statusNote">
    Fetching live data from Supabase… if you see this message persist, check that
    SUPABASE_URL and SUPABASE_ANON_KEY below are filled in with your project's real values.
  </div>

  <div class="ward-grid" id="wardGrid"></div>
  <div id="detail"></div>
</div>

<script>
// ---- Fill these in after you've created your Supabase project (see runbook) ----
const SUPABASE_URL = "https://tmadecudidpxvtitdeol.supabase.co/rest/v1/";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRtYWRlY3VkaWRweHZ0aXRkZW9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4NzY1OTUsImV4cCI6MjEwMjQ1MjU5NX0.qx1nkkFDuXvAR-EAy3I-bn3sdFYzlZ4hoHN92d0IfMU";
// ----------------------------------------------------------------------------

const grid = document.getElementById('wardGrid');
const detail = document.getElementById('detail');
const statusNote = document.getElementById('statusNote');
let WARDS = {};   // ward_no -> {name, member, items: []}

async function loadData() {
  const headers = { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` };

  const [corporatorsRes, itemsRes] = await Promise.all([
    fetch(`${SUPABASE_URL}/rest/v1/corporators?select=*`, { headers }),
    fetch(`${SUPABASE_URL}/rest/v1/agenda_items?select=*&ward_no=not.is.null`, { headers })
  ]);
  if (!corporatorsRes.ok || !itemsRes.ok) {
    throw new Error(`Supabase returned ${corporatorsRes.status}/${itemsRes.status} — check your URL/key and that the tables + CSVs were imported.`);
  }
  const corporators = await corporatorsRes.json();
  const items = await itemsRes.json();

  corporators.forEach(c => {
    WARDS[c.ward_no] = { name: null, member: `${c.name} (${c.party || '—'})`, items: [] };
  });

  // pull ward_name via a second query (kept separate since it's a different table)
  const wardsRes = await fetch(`${SUPABASE_URL}/rest/v1/wards?select=*`, { headers });
  const wardRows = await wardsRes.json();
  const nameByNumber = {};
  wardRows.forEach(w => { nameByNumber[w.ward_number] = w.ward_name; });
  Object.keys(WARDS).forEach(wardNo => {
    const num = wardNo.replace(/[A-Z]$/, '');
    WARDS[wardNo].name = nameByNumber[num] || 'Unknown ward';
  });

  items.forEach(it => {
    if (WARDS[it.ward_no]) WARDS[it.ward_no].items.push(it);
  });
}

function renderGrid() {
  grid.innerHTML = '';
  const activeWards = Object.keys(WARDS).filter(w => WARDS[w].items.length > 0).sort();
  if (activeWards.length === 0) {
    statusNote.textContent = 'Connected to Supabase, but no agenda_items rows have a matching ward_no yet — check the CSV import.';
    return;
  }
  statusNote.textContent = `Live from Supabase: ${activeWards.length} ward(s) with logged items, out of 165 corporators / 41 wards in the master tables.`;

  activeWards.forEach(key => {
    const d = WARDS[key];
    const div = document.createElement('div');
    div.className = 'ward-card';
    div.id = 'card-' + key;
    const num = key.replace(/(\d+)([A-Z])/, '$1 $2');
    div.innerHTML = `
      <div class="ward-stamp"><span class="cnt">${d.items.length}</span><span class="lbl">items</span></div>
      <div class="ward-num">${num}</div>
      <div class="ward-name">${d.name}</div>
      <div class="tap-hint">Click to view →</div>
    `;
    div.addEventListener('click', () => showDetail(key));
    grid.appendChild(div);
  });
}

function showDetail(key) {
  document.querySelectorAll('.ward-card').forEach(el => el.classList.remove('active'));
  document.getElementById('card-' + key).classList.add('active');

  const d = WARDS[key];
  const itemsHtml = d.items.map(it => `
    <div class="item-card">
      <div class="item-top">
        <span class="item-subj">Vishay ${it.subject_no || '?'}</span>
        <span class="item-date">${it.meeting_date || ''} · ${it.meeting || ''}</span>
      </div>
      <div class="item-desc">${it.description || '(no description captured)'}</div>
      <div class="item-foot">
        <span><b>Section:</b> ${it.section || '—'}</span>
        <span><b>Mover:</b> ${it.mover || '—'}</span>
        <span class="mono"><b>Budget code:</b> ${it.budget_codes || '—'}</span>
      </div>
    </div>
  `).join('');

  const num = key.replace(/(\d+)([A-Z])/, '$1 $2');
  detail.innerHTML = `
    <div class="detail-head">
      <div>
        <h2>Ward ${num} — ${d.name}</h2>
        <div class="meta">${d.member} · ${d.items.length} item${d.items.length > 1 ? 's' : ''} logged</div>
      </div>
      <button class="close-btn" onclick="closeDetail()">Close ✕</button>
    </div>
    ${itemsHtml}
  `;
  detail.classList.add('show');
  detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closeDetail() {
  detail.classList.remove('show');
  document.querySelectorAll('.ward-card').forEach(el => el.classList.remove('active'));
}

loadData()
  .then(renderGrid)
  .catch(err => {
    statusNote.textContent = 'Could not load from Supabase: ' + err.message;
    statusNote.style.borderLeftColor = '#A63D2F';
  });
</script>
</body>
</html>
